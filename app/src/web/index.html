<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The dev policy: Vite's dev server needs localhost connections for HMR.
      A build closes them all (build/csp.ts hardenWebCsp) — the published
      page requests nothing but its own files. Framing cannot be forbidden
      from a meta tag; main.ts refuses to run inside a frame instead.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:* ws://127.0.0.1:* http://127.0.0.1:*; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Shark Deck in your browser: configure Attack Shark mice and keyboards over WebHID, with nothing to install."
    />
    <meta name="theme-color" content="#0a0c10" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <title>Shark Deck</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
