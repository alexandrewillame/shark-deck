<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shark Deck</title>
    <style>
      :root {
        --bg-top: #1e2229;
        --bg: #16191e;
        --edge: rgba(255, 255, 255, 0.09);
        --tile: rgba(255, 255, 255, 0.06);
        --text: #ffffff;
        --sub: #9aa7ba;
        --accent: #3df8e8;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
        background: transparent;
      }
      /* The window is a fixed box (main/overlayWindow.ts); the card sits in its
         bottom-right corner, the corner main anchors to the screen's, with
         room around it for its shadow. The rest is transparent. */
      body {
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 12px;
        font-family: 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
        -webkit-user-select: none;
      }
      /* A gaming app's notification: a small header saying whose it is, then
         the one piece of news, and a bar counting down how long it stays. */
      .card {
        position: relative;
        width: 272px;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        gap: 9px;
        padding: 10px 14px 13px;
        background: linear-gradient(180deg, var(--bg-top), var(--bg));
        border: 1px solid var(--edge);
        border-radius: 12px;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
        overflow: hidden;
        /* Fades as the pointer comes near (--prox: 0 on the card, 1 clear of
           it), so it never hides what you are about to click — the same rule,
           and the same numbers, as the in-app toasts (shared/proximityFade). */
        opacity: calc(0.12 + 0.88 * var(--prox, 1));
        transition: opacity 120ms linear;
      }
      .card.enter {
        animation: enter 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      @keyframes enter {
        from {
          transform: translateY(10px);
        }
      }
      .head {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--sub);
      }
      .head img {
        width: 14px;
        height: 14px;
        object-fit: contain;
      }
      .body {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      /* The subject: the game's own icon, its initial when it has none, or the
         desktop on the way back. */
      .tile {
        width: 44px;
        height: 44px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: var(--tile);
        border: 1px solid var(--edge);
      }
      .tile img {
        width: 32px;
        height: 32px;
        object-fit: contain;
      }
      .tile .letter {
        font-size: 19px;
        font-weight: 700;
        color: var(--accent);
      }
      .tile svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: var(--sub);
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .text {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }
      .mode {
        font-size: 15px;
        font-weight: 700;
        line-height: 1.2;
        color: var(--text);
        /* Two lines at most: a long mode name must not push the game off. */
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .exe {
        font-size: 12px;
        color: var(--sub);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* How long the card has left: drains over its stay (`--ms`). */
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        background: rgba(255, 255, 255, 0.05);
      }
      .bar span {
        display: block;
        height: 100%;
        background: var(--accent);
        transform-origin: left;
        animation: drain var(--ms, 10000ms) linear forwards;
      }
      @keyframes drain {
        to {
          transform: scaleX(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="head">
        <img id="logo" alt="" aria-hidden="true" hidden />
        <span id="brand"></span>
      </div>
      <div class="body">
        <div class="tile" aria-hidden="true">
          <img id="game-icon" alt="" hidden />
          <span class="letter" id="game-letter" hidden></span>
          <svg id="desktop" viewBox="0 0 24 24" hidden>
            <rect x="3" y="4" width="18" height="12" rx="2" />
            <path d="M8 20h8M12 16v4" />
          </svg>
        </div>
        <div class="text">
          <div class="mode" id="mode"></div>
          <div class="exe" id="exe" hidden></div>
        </div>
      </div>
      <div class="bar" id="bar"><span></span></div>
    </div>
    <script type="module" src="./overlay.ts"></script>
  </body>
</html>
